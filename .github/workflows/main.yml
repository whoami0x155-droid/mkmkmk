name: Qureo Solver (Tailscale Egypt VPN)

on:
  workflow_dispatch:
    inputs:
      course:
        description: 'اسم الكورس (مثال: js أو python)'
        required: true
        default: 'js'
      chapter:
        description: 'رقم الشابتر'
        required: true
        default: '19'

jobs:
  run-solver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Connect Tailscale & Route via Egypt Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # اكتب اسم جهازك اللي في مصر الظاهر في لوحة Tailscale
          exit-node: "motaz-eldaba-ninja0x"

      - name: Verify Connection IP & Location
        run: |
          echo "=== معلومات الـ IP الحالية ==="
          curl -s https://ipinfo.io/json

      - name: Run Qureo Solver Script
        run: |
          python3 qureo_solver.py solve --id "469912939" --pass "Vu8D_fEq" --course ${{ github.event.inputs.course }} --chapter ${{ github.event.inputs.chapter }}
