name: Qureo Solver (Egypt VPN)

on:
  workflow_dispatch:
    inputs:
      course:
        description: 'اسم الكورس (مثال: js أو python)'
        required: true
        default: 'js'
      chapter:
        description: 'رقم الشابتر'
        required: true
        default: '19'

jobs:
  run-solver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn curl

      - name: Connect to Egypt VPN via VPN Gate
        run: |
          # 1. جلب ملف إعدادات سيرفر مصري مجاني من VPN Gate
          curl -s "https://www.vpngate.net/api/iphone/" | grep ",EG," | head -n 1 | cut -d',' -f15 | base64 -d > egypt.ovpn

          # 2. التحقق من نجاح الحصول على السيرفر
          if [ ! -s egypt.ovpn ]; then
            echo "خطأ: لم يتم العثور على سيرفر مصري متاًح حالياً على VPN Gate."
            exit 1
          fi

          # 3. تشغيل الـ VPN في الخلفية
          sudo openvpn --config egypt.ovpn --daemon

          # 4. الانتظار 10 ثوانٍ لضمان اكتمال الاتصال
          sleep 10

      - name: Verify Connection IP & Location
        run: |
          echo "=== معلومات الـ IP الحالية ==="
          curl -s https://ipinfo.io/json

      - name: Run Qureo Solver Script
        run: |
          python3 qureo_solver.py solve --id "469912939" --pass "Vu8D_fEq" --course ${{ github.event.inputs.course }} --chapter ${{ github.event.inputs.chapter }}
