name: Test Tailscale Connection

on:
  workflow_dispatch: # لتشغيل الاختبار يدوياً من تبويب Actions

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authKey: ${{ secrets.TS_AUTH_KEY }}
        exit-node: "ninja0x"
        exit-node-allow-lan: true

    - name: Test IP and Connection
      run: |
        python -c "
        import urllib.request
        import json
        
        req = urllib.request.urlopen('https://ipinfo.io/json')
        data = json.loads(req.read().decode('utf-8'))
        print('Current IP Info via Tailscale:')
        print(json.dumps(data, indent=2))
        "
