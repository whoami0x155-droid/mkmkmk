name: Run Qureo Solver Bot

on:
  workflow_dispatch:
    inputs:
      student_id:
        description: 'رقم المستخدم (ID)'
        required: true
        type: string
      password:
        description: 'كلمة السر (Password)'
        required: true
        type: string
      chapters:
        description: 'الفصول المراد حلها (مثال: 7-25)'
        required: true
        default: '7-25'
        type: string
      course:
        description: 'الكورس (python أو javascript)'
        required: false
        type: choice
        options:
          - 'python'
          - 'javascript'

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run Qureo Solver
        run: |
          # تجهيز الأمر الأساسي
          CMD="python qureo_solver.py solve --id '${{ github.event.inputs.student_id }}' --pass '${{ github.event.inputs.password }}' --chapters '${{ github.event.inputs.chapters }}'"
          
          # إضافة شرط الكورس في حال تم اختياره
          if [ -n "${{ github.event.inputs.course }}" ]; then
            CMD="$CMD --course ${{ github.event.inputs.course }}"
          fi
          
          eval $CMD
