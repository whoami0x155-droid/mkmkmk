name: Run Qureo Solver Bot

on:
  # لتمكين التشغيل اليدوي من تبويب Actions في GitHub
  workflow_dispatch:
    inputs:
      student_id:
        description: 'رقم المستخدم (ID)'
        required: true
        type: string
      password:
        description: 'كلمة السر (Password)'
        required: true
        type: string
      chapters:
        description: 'الفصول المراد حلها (مثال: 7-25)'
        required: true
        default: '7-25'
        type: string

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المتطلبات و Playwright
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright
          python -m playwright install chromium --with-deps

      # 4. تشغيل السكربت بالبيانات المحددة
      - name: Run Qureo Solver
        run: |
          python qureo_solver.py solve --id "${{ github.event.inputs.student_id }}" --pass "${{ github.event.inputs.password }}" --chapters "${{ github.event.inputs.chapters }}"
